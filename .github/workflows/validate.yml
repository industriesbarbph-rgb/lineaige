name: Validate LINEAiGE

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate canonical data and references
        run: python3 scripts/validate.py

      - name: Audit evidence roles and geographic context
        run: python3 scripts/audit_evidence_context.py

      - name: Audit relationship semantics
        run: python3 scripts/audit_relationship_semantics.py

      - name: Audit frontend accessibility and deployment readiness
        run: python3 scripts/audit_frontend.py

      - name: Audit static delivery dependencies
        run: python3 scripts/audit_static_delivery.py

      - name: Check JavaScript syntax
        run: |
          node --check lineaige.js
          node --check media.js
          node --check courses.js
