name: ALW Evidence Scan
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lineaige-data-write
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run ALW discovery
        run: python3 scripts/alw_scan.py
      - name: Validate automation contracts
        run: python3 scripts/audit_automation.py
      - name: Commit ALW state
        run: |
          if git diff --quiet -- data/alw; then exit 0; fi
          git config user.name "LINEAiGE ALW"
          git config user.email "actions@users.noreply.github.com"
          git add data/alw
          git commit -m "ALW: refresh evidence discovery"
          git push
